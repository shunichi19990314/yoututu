<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>動画 → M3U8変換</title>

  <style>
    body {
      font-family: Arial, sans-serif;
      background: #f5f5f5;
      margin: 0;
      padding: 50px 20px;
    }

    .container {
      max-width: 700px;
      margin: auto;
    }

    .card {
      background: white;
      padding: 30px;
      border-radius: 12px;
      box-shadow: 0 5px 20px rgba(0,0,0,.08);
    }

    h1 {
      text-align: center;
    }

    input {
      width: 100%;
      padding: 14px;
      margin-top: 20px;
      box-sizing: border-box;
      border: 1px solid #ccc;
      border-radius: 7px;
      font-size: 16px;
    }

    button {
      width: 100%;
      margin-top: 15px;
      padding: 14px;
      background: #111;
      color: white;
      border: none;
      border-radius: 7px;
      font-size: 16px;
      cursor: pointer;
    }

    button:disabled {
      opacity: .5;
    }

    #status {
      margin-top: 20px;
      white-space: pre-wrap;
    }

    #result {
      display: none;
      margin-top: 25px;
    }

    .url {
      word-break: break-all;
    }

    video {
      width: 100%;
      margin-top: 20px;
    }

    .notice {
      padding: 12px;
      background: #fff8df;
      border-radius: 7px;
      line-height: 1.6;
      font-size: 14px;
    }
  </style>
</head>

<body>

<div class="container">

  <div class="card">

    <h1>動画 → M3U8変換</h1>

    <div class="notice">
      自分が権利を持つ動画、または権利者から
      ダウンロード・変換の許可を得ている動画のみ使用してください。
    </div>

    <input
      id="url"
      type="url"
      placeholder="動画URLを入力してください"
    >

    <button id="convert">
      M3U8に変換
    </button>

    <div id="status"></div>

    <div id="result">

      <h2>変換完了</h2>

      <p>M3U8 URL：</p>

      <p class="url">
        <a id="playlist" target="_blank"></a>
      </p>

      <video
        id="video"
        controls
      ></video>

    </div>

  </div>

</div>

<script>

const button = document.getElementById("convert");
const input = document.getElementById("url");
const status = document.getElementById("status");
const result = document.getElementById("result");
const playlist = document.getElementById("playlist");
const video = document.getElementById("video");

button.addEventListener("click", async () => {

  const url = input.value.trim();

  if (!url) {
    status.textContent = "動画URLを入力してください。";
    return;
  }

  button.disabled = true;
  result.style.display = "none";

  status.textContent =
    "動画を取得・変換しています。\nしばらくお待ちください。";

  try {

    const response = await fetch("/convert", {
      method: "POST",

      headers: {
        "Content-Type": "application/json"
      },

      body: JSON.stringify({
        url: url
      })
    });

    const data = await response.json();

    if (!response.ok) {
      throw new Error(
        data.error || "変換に失敗しました。"
      );
    }

    const absoluteUrl =
      new URL(
        data.playlist,
        window.location.origin
      ).href;

    playlist.href = absoluteUrl;
    playlist.textContent = absoluteUrl;

    video.src = data.playlist;

    result.style.display = "block";

    status.textContent =
      "変換が完了しました。";

  } catch (error) {

    console.error(error);

    status.textContent =
      "エラー：\n" + error.message;

  } finally {

    button.disabled = false;

  }

});

</script>

</body>
</html>
